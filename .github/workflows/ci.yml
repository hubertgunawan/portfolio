name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Check the phone number is not published (PRD §4.1)
        run: |
          if grep -rIE --exclude="*.pdf" "0851 ?0504 ?8128|85105048128" out/; then
            echo "Phone number found in build output" && exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: out/
          retention-days: 7

  # Deploy job (S3 + CloudFront via OIDC) is added in M0 once the AWS infra exists.
